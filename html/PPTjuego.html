<!doctype html>
<html lang="es">
  <head>
    <title>Piedra, papel o tijera</title>
    <link rel="stylesheet" href="../css/estilo.css" />
    <script src="../js/juego.js" defer></script>
    <script src="../js/tema.js" defer></script>
  </head>
  <body>
    <main class="game-page">
      <div class="opciones">
        <button type="button" onclick="juego('piedra')">
          Piedra
          <span class="opcion-simbolo" aria-hidden="true">🪨</span>
        </button>
        <button type="button" onclick="juego('papel')">
          Papel
          <span class="opcion-simbolo" aria-hidden="true">📄</span>
        </button>
        <button type="button" onclick="juego('tijera')">
          Tijera
          <span class="opcion-simbolo" aria-hidden="true">✂️</span>
        </button>
      </div>

      <p id="marcador">Partidas jugadas: 0</p>
      <p id="ganadas">Partidas ganadas: 0</p>
      <p id="empatadas">Partidas empatadas: 0</p>
      <p id="perdidas">Partidas perdidas: 0</p>

      <section id="resultado">
        <h2>resultado</h2>
        <p id="jugada-jugador">Tu jugada aparecerá aquí</p>
        <p id="jugada-maquina">La maquina eligió</p>
        <p id="mensaje"></p>
      </section>
    </main>
  </body>
</html>
